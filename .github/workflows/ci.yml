# This repository's own gate. It is not the recipe a project using nukadoko
# should copy: that one is docs/ci.md, and it runs `nuka check` and `nuka run`
# against an application. This one runs nukadoko's own tests.
#
# Actions are pinned to commit ids rather than tags, with the version beside
# them so the line stays readable. This repository also requires that pinning
# at the settings level, so a tag here would be refused before it ran.
name: ci

on:
  push:
    # queue is where a change lands before main. A push there has to run
    # this gate. main runs it again when that branch moves. publish.yml
    # stays on main only, so a push here does not publish.
    branches: [main, queue]
  pull_request:

# Nothing here writes anything back. An injected workflow is limited by what
# its token may do, so the token is given only what this one needs.
permissions:
  contents: read

# A superseded run has nothing left to tell anyone.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads the source only: no browser and no test run. archstrict reads the
  # TypeScript, and typecheck builds dist/ and checks the tests against it.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 rather than the older LTS: this lockfile was produced by npm 11
          # and npm 10 cannot install from it. See CONTRIBUTING.md.
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      # `--ignore-scripts` is also set by this repository's .npmrc. It is
      # written here too because the line is where a reader looks.
      - run: npm ci --ignore-scripts
      - run: npm run archstrict
      - run: npm run typecheck

  # The Vitest suite, split by file across four runners. Run whole on one
  # runner it took seven and a half minutes, almost all of the gate's wall
  # clock. A public repository's standard runners cost nothing per minute,
  # so four of them cost only the setup each one repeats.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --ignore-scripts

      # Browsers are never installed by `npm ci`. They live in a cache
      # outside node_modules that only this command fills, and a fresh
      # runner has none. Chromium is the only one the suite launches.
      - run: npx playwright install --with-deps chromium

      - run: npm test -- --shard=${{ matrix.shard }}/4

  # The selftest suite: the same features run by nukadoko and by cucumber-js,
  # which must agree. It needs the browser too, and runs beside the shards.
  selftest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run selftest

  # The packed tarball, installed into a fresh project and driven through
  # the CLI (scripts/pack-check.mjs), on the patched 22 release and on the
  # newest line. 22.23.4 fixes the Brotli decoder out-of-bounds write and
  # the TLS hostname-check bypasses. package.json engines still allow
  # 22.18.0, so this pin is not that floor. The main job runs on 24 only,
  # because its lockfile needs npm 11. Here npm installs the tarball alone,
  # which any npm can do, so the build happens on 24 and the check on the
  # matrix release.
  packed-tarball:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node scripts/pack-check.mjs
      # The nukadoko skill's worked examples, each run from a copy of its
      # project under examples/acceptance/ against the same kind of install,
      # and compared with the transcripts its Markdown quotes.
      - run: node scripts/skill-examples.ts

  # How runCommand and runServer start a program on Windows: a bare name found through
  # PATH and PATHEXT, and a .cmd file run through cmd.exe with its arguments
  # escaped. Only Windows has cmd.exe, so only this job can check the
  # escaping against it. The rest of the suite runs on ubuntu.
  windows-run-command:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: typescript
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/windows-command.test.ts

  # The Ruby engine under ruby/, held to the TypeScript engine by the cases
  # under conformance/: the TypeScript engine runs each case and compares it
  # with expected.json, then the Ruby engine runs the same case and must
  # agree.
  ruby-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: typescript
      - run: npm run build
        working-directory: typescript
      - run: npx playwright install --with-deps chromium
        working-directory: typescript
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby
      - run: node conformance/run-ts.mjs
      - run: bundle exec ruby ../conformance/run-rb.rb
        working-directory: ruby
      - run: bundle exec bin/test
        working-directory: ruby
      # The Ruby engine's code registry is the TypeScript engine's, so one
      # code gives the same fix in either.
      - run: node typescript/dist/cli.js check --codes --json | ruby ruby/bin/sync-codes --check
      # The scenarios under conformance/engine/, each run once in the world
      # typescript and once in the world ruby: what nuka itself does (its
      # targets, --tag, --env), which a case's expected.json cannot hold.
      - run: node conformance/run-engine.mjs

  # The Ruby engine's own types: rbs-inline writes sig/generated from lib/'s
  # comments, the committed copy must be that output, and Steep checks lib/
  # against it. Steep logs a FATAL or ERROR line and skips the code it could
  # not read while still exiting 0, so such a line fails the job too.
  ruby-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rbs-inline --output=sig/generated lib
        working-directory: ruby
      - run: git add --intent-to-add sig && git diff --exit-code sig
        working-directory: ruby
      - run: bundle exec steep check 2>&1 | tee steep.log; test "${PIPESTATUS[0]}" -eq 0 && ! grep -qE ': (FATAL|ERROR): \[Steep' steep.log
        working-directory: ruby
        shell: bash
