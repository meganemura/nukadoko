name: Release the gem

# The Ruby engine under ruby/ is its own package with its own version, so it
# releases on its own: a push to main that changes ruby/lib/nukadoko/version.rb
# starts this workflow, and publish.yml (the npm package) does not run. The tag
# is ruby-v<version>, so it never meets the npm package's v<version> tags.
# GitHub does not start workflows from a push made with the workflow's own
# token, so the tag is created last, after the gem is out.
on:
  push:
    branches:
      - main
    paths:
      - ruby/lib/nukadoko/version.rb
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-gem
  cancel-in-progress: false

jobs:
  check:
    name: Find a gem version with no tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The API answers an empty list for a missing tag, so a failed request
      # stops the run instead of reading as "no tag yet" and publishing again.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(ruby -Iruby/lib -e 'require "nukadoko/version"; puts Nukadoko::VERSION')
          tag="ruby-v$version"
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
          if [ "$found" != 0 ]; then
            echo "$tag already exists, so this run releases nothing"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      # Read before the gem is pushed, so a missing section stops the release
      # while nothing is published yet.
      - id: notes
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v v="${TAG#ruby-v}" 'index($0, "## [" v "]") == 1 {in_version=1; next} /^## /{in_version=0} in_version' ruby/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "ruby/CHANGELOG.md has no section for ${TAG#ruby-v}" >&2
            exit 1
          fi
          delimiter="notes_$(openssl rand -hex 16)"
          { echo "notes<<$delimiter"; cat notes.md; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  # The same checks as ci.yml's ruby-engine job, on the commit that releases.
  test:
    name: Run the Ruby engine's checks on the release commit
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby
      - run: node conformance/run-ts.mjs
      - run: bundle exec ruby ../conformance/run-rb.rb
        working-directory: ruby
      - run: bundle exec bin/test
        working-directory: ruby

  # The rubygems environment's approval is the last gate, and only this job
  # holds the RubyGems OIDC token. It runs no test code. The RubyGems trusted
  # publisher names this file and this environment.
  publish:
    name: Publish the gem
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler: none
      - name: Build the gem
        working-directory: ruby
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gem build nukadoko.gemspec
          test -f "nukadoko-${TAG#ruby-v}.gem"
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      # A rerun after a successful push gets "Repushing of gem versions is not
      # allowed"; that is the only failure worth skipping.
      - name: Push the gem to RubyGems
        working-directory: ruby
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          if output=$(gem push "nukadoko-${TAG#ruby-v}.gem" 2>&1); then
            echo "$output"
          elif echo "$output" | grep -q "Repushing of gem versions is not allowed"; then
            echo "$output"
          else
            echo "$output"
            exit 1
          fi

  release:
    name: Create the tag and the GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A rerun finds the release already created, so it updates it instead.
      # --latest=false keeps the npm package's release as the latest one.
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "nukadoko gem ${TAG#ruby-v}" --latest=false --notes-file notes.md
          fi
