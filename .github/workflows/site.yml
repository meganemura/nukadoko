# Builds the documentation site in site/ from docs/, the READMEs, and llms.txt, and
# publishes it to GitHub Pages at https://meganemura.github.io/nukadoko/ when main moves.
# The build fails on a section no page takes, on a Japanese document whose sections do not
# pair with its English one, and on a link to a page or heading that does not exist, so
# queue and pull requests run it too. Only main deploys.
name: site

on:
  push:
    branches: [main, queue]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # A deploy that main started finishes; a newer build elsewhere replaces an older one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:engines
      - run: npm run build
      # upload-pages-artifact calls actions/upload-artifact by tag, which the repository's
      # rule that every action is pinned to a commit id refuses, so its two steps are inlined.
      - name: Archive dist
        if: github.ref == 'refs/heads/main'
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
